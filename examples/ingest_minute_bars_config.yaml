# Backfills 1-minute OHLCV bars for SPY + the point-in-time S&P 500 universe
# into a MinuteBarStore. Run with:
#   python -m examples.ingest_minute_bars examples/ingest_minute_bars_config.yaml
#
# This example targets a LOCAL store using a tiny static universe -- good for
# validating the pipeline end to end before pointing store: at R2. The
# provider needs MASSIVE_S3_ACCESS_KEY_ID/MASSIVE_S3_SECRET_ACCESS_KEY (see
# .env) -- MassiveFlatFileProvider's endpoint/bucket/schema defaults are
# already correct (verified live against files.massive.com). For production,
# swap:
#   store: r2_parquet    (needs R2_ACCOUNT_ID/R2_ACCESS_KEY_ID/
#                          R2_SECRET_ACCESS_KEY/R2_BUCKET -- see .env)
#   universe: pitindex   (point-in-time S&P 500 constituents -- needs the
#                          `pitindex` extra, Python >=3.11)
# See MARKETDATA.md for the full walkthrough.
marketdata:
  provider: massive_flatfiles
  store: local_parquet
  store_kwargs:
    root: data/minute
  universe: static
  universe_kwargs:
    tickers: [AAPL, MSFT]
  extra_symbols: [SPY]
  start: "2024-01-02"
  end: "2024-01-05"
