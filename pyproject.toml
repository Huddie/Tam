[project]
name = "tam-quant"
version = "0.1.25"
description = "Config, data ingestion, and event-driven backtesting for stocks/indices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "yfinance>=0.2",
    "plotly>=5.20",
    "pydantic>=2.6",
    "TA-Lib>=0.6.5",
    "scikit-learn>=1.7.2",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/Huddie/Tam"

[project.scripts]
upload-discovery = "tam.discovery.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ipython>=8.0", "ruff>=0.15", "pre-commit>=3.5"]
live = ["dash>=2.17"]
# mlx-lm/mlx only run on an M-series Mac (Metal) -- a hard dependency here would
# make `pip install tam-quant` fail outright on Linux/Colab/Windows, not just
# leave an unusable feature installed. Only tam.strategy.mlx_lora_client
# needs this; every other strategy works fine without it (see
# tam/strategy/__init__.py, which registers strategies defensively so a
# missing optional dependency skips just that one strategy, not the whole
# package).
llm = ["mlx-lm>=0.31.3"]
# tam.backtest.runner.run_backtest(..., live=True) redraws the chart via
# IPython's own display()/clear_output() -- always present already inside
# a real notebook kernel (Jupyter, Colab, ...), so this extra only matters
# for running that code path OUTSIDE one (e.g. this repo's own test suite).
# No version floor: both functions predate IPython 7.x, and Colab pins its
# own ipython==7.34.0 (via the google-colab package) -- a ">=8.0" floor here
# forces pip to upgrade ipython/ipykernel/tornado/prompt-toolkit underneath
# an already-running Colab kernel, which reliably crashes or hangs the
# runtime (Colab's own warning: "Upgrading ipython, ipykernel, tornado,
# prompt-toolkit ... can cause your runtime to repeatedly crash").
# ipywidgets: DuckDB's own Jupyter-kernel detection requires it to be
# installed to change `enable_progress_bar` at all inside a real kernel
# (even to turn it off) -- tam.marketdata.duckdb_query._configure_connection
# catches the resulting InvalidInputException without it, but installing
# this keeps the progress-bar-disable (see that function's own docstring
# for why that matters) actually working rather than silently skipped.
notebook = ["ipython", "ipywidgets"]
quantstats = [
    "quantstats>=0.0.81",
]
# pitindex needs Python >=3.11 -- stricter than this project's own floor
# (>=3.10). The env marker means `pip install tam-quant[pitindex]` on 3.10
# resolves to nothing installed rather than making the WHOLE project
# uninstallable there (same reasoning as the `llm` extra's platform marker
# above, just for a Python-version constraint instead of a platform one).
pitindex = [
    "pitindex; python_version >= '3.11'",
]
# duckdb/pandas_market_calendars are only needed for the historical 1-minute
# market-data lake (tam.marketdata) -- irrelevant to running a backtest, so
# gated behind their own extra like every other specialty dependency here
# rather than made a hard dependency of the whole package.
#
# boto3: R2MinuteBarStore's read/write path uses it directly instead of
# pyarrow.fs.S3FileSystem -- pyarrow's S3FileSystem ALWAYS performs a
# multipart upload for open_output_stream() writes, not something
# controllable via its public API, and R2 has been observed in production
# failing to reliably complete that multipart handshake ("NO_SUCH_UPLOAD
# during CompleteMultipartUpload" / an internal-error response on an
# otherwise-successful upload), crashing the whole backfill outright.
# boto3's plain put_object()/get_object() do a single-request PUT/GET for
# objects this small (a few hundred KB), never touching multipart -- the
# same approach Massive's own "Flat Files Quickstart" docs demonstrate for
# their side of this pipeline.
marketdata = [
    "duckdb>=1.0",
    "pandas_market_calendars>=4.0",
    "boto3>=1.34",
    # tam.marketdata.reference_provider wraps this for four of its six
    # reference datasets (ipos/short_volume/short_interest/float) -- the
    # other two (splits/dividends) go through plain `requests` (already a
    # base dependency) directly against a newer endpoint this SDK version
    # doesn't wrap yet, see that module's own docstring for why.
    "massive>=2.8",
]
# tam.Fred wraps this -- kept as its own small extra (not a hard dependency)
# since it's a third-party API integration nothing else in this package
# depends on; tam.research.data.fred itself only imports fredapi lazily
# inside Fred.get(), so `import tam`/referencing `tam.Fred.Datasets` never
# requires this to be installed, only actually fetching a series does.
fred = [
    "fredapi>=0.5",
]
# tam.research.data.sec.normalize imports edgar.standardization directly
# (a pure-Python concept-name-mapping table, no network/heavy XBRL parsing
# of its own) to reuse EdgarTools' own maintained synonym groups instead
# of a hand-rolled, smaller alias table -- see that module's own docstring
# for why. tam.research.data.sec.provider fetches raw data directly from
# SEC's own JSON APIs (not through EdgarTools), so this extra is scoped to
# the concept-standardization use only, not a dependency of the whole
# subpackage.
sec = [
    "edgartools>=5.0",
]
# tam.ml's Model/SkorchModel + the "mlp" default architecture. CPU-only wheel
# is still ~200MB -- kept optional (not a hard dependency of the whole
# package) same reasoning as every other heavy/specialty extra here: torch/
# skorch are only imported lazily inside tam/ml/model.py's own functions, so
# `import tam.ml`/anything that imports it works fine without either
# installed; only actually building/training a model needs them. skorch
# wraps a plain nn.Module in an sklearn-compatible fit/predict/save/load
# API (see tam/ml/model.py's own docstring for why this is used instead of
# a hand-rolled training loop) and pulls in `tabulate`/`tqdm` transitively
# -- both tiny, already-common packages, confirmed via dry-run resolution.
ml = [
    "torch>=2.2",
    "skorch>=1.4",
]
docs = [
    "sphinx>=7.0",
    "myst-parser>=2.0",
    "furo>=2024.1.29",
]
# Every runtime feature extra in one shot, for local/Colab use where you'd
# rather not track which specific extra a given import needs -- `dev`/`docs`
# deliberately excluded (dev tooling and doc-building, not library features).
# Self-referencing (tam-quant[...]) rather than repeating each extra's own
# dependency list -- pip/setuptools resolve this against the package
# currently being installed, no separate maintenance burden.
all = [
    "tam-quant[live,llm,notebook,quantstats,pitindex,marketdata,fred,sec,ml]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tam*"]

[tool.pytest.ini_options]
markers = [
    "slow: real end-to-end tests (e.g. a full backtest run) -- excluded from the pre-commit smoke run (`pytest -m 'not slow'`), still run in full by CI (.github/workflows/test.yml has no marker filter)",
]

[tool.ruff]
# 120, not ruff's own default of 88 -- this codebase's existing style
# already runs long lines (docstrings/comments especially); 120 covers
# nearly everything already here (only 49 lines in tam/ exceed it, vs 594
# that exceed 88), which keeps `ruff format`'s reflow diff small when it
# first touches a file that predates this config.
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Pinned EXPLICITLY rather than left to ruff's own "default" selection --
# confirmed live: bumping from ruff 0.15.20 (what this was reviewed
# against) to 0.16.5 (what a bare `ruff>=0.15` resolved to) pulled in a
# much broader default rule set (bugbear, flake8-datetimez, flake8-
# comprehensions, tryceratops, blind-except, pyupgrade, ...) that flagged
# 500+ pre-existing, unreviewed issues across the repo the first time the
# pre-commit hook ran -- including rules that actively fight this
# codebase's own deliberate conventions (e.g. BLE001 "no blind except",
# when catching bare Exception around a Colab/subprocess call is the
# intentional pattern in several places, each with its own comment
# explaining why). E4/E7/E9/F is ruff's own historical default and the
# actual rule set this whole setup was reviewed against -- selecting it
# explicitly means a future ruff upgrade can't silently expand scope
# again the way the implicit default just did.
select = ["E4", "E7", "E9", "F"]
