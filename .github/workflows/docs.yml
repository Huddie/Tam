name: Deploy Docs

# Builds the Sphinx site in docs/ and pushes the built HTML to the
# gh-pages branch on every push to main that touches something the docs
# reference -- peaceiris/actions-gh-pages creates gh-pages (orphan branch,
# no history from main) itself on first run if it doesn't exist yet.
"on":
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tam/**"
      - "README.md"
      - "tam-discovery/README.md"
      - "tam-data-explorer/README.md"
      - "pyproject.toml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"

      - run: uv sync --extra docs

      - run: uv run sphinx-build -b html docs docs/_build/html

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
