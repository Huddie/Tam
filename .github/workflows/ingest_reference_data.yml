name: Ingest Reference Data

# Incremental ingest of Massive/Polygon reference data (splits, dividends,
# IPOs, short volume, short interest, float) into the R2 Parquet lake --
# see tam/marketdata/reference_ingest.py. Tests must pass before this runs
# at all (same `needs: test` gating pattern as ingest_minute_bars.yml).
#
# Unlike minute bars, there's no explicit date range to resolve here: each
# append-only dataset (splits/dividends/short_volume/short_interest)
# fetches only rows newer than its own stored cursor (see
# reference_ingest.py's Manifest), and the two full-refresh datasets
# (ipos/float) always re-fetch their entire current table regardless.
# Re-running this after an already-successful run is a fast, safe no-op
# for the incremental datasets (an empty page) and a small, harmless
# re-fetch for the full-refresh ones.
#
# Runs daily via `schedule:` (10:00 UTC, same time as ingest_minute_bars.yml),
# plus workflow_dispatch for an on-demand catch-up run.
#
# Requires these repository secrets before a run does anything useful
# (Settings -> Secrets and variables -> Actions):
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
#   MASSIVE_API_KEY
# MASSIVE_API_KEY is the REST bearer token -- a DIFFERENT secret than
# MASSIVE_S3_ACCESS_KEY_ID/MASSIVE_S3_SECRET_ACCESS_KEY (S3 flat-file
# credentials for a different Massive product surface, used by
# ingest_minute_bars.yml instead). Without them, a run fails fast with a
# clear "Missing R2 credential field(s)" / "Massive REST API key required"
# error rather than silently doing nothing.
"on":
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {}

env:
  UV_DEFAULT_INDEX: https://pypi.org/simple

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"

      - run: uv sync --extra dev --extra live --extra notebook --extra quantstats --extra pitindex --extra marketdata

      - run: uv run pytest tests/ -q -W ignore::UserWarning

  ingest:
    needs: test
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"

      - run: uv sync --extra marketdata

      - run: uv run python -m examples.ingest_reference_data
