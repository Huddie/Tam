name: Publish to PyPI

# Runs on every push to main that touches something that actually affects
# the published PyPI package (a direct commit or a merged PR) -- tam-
# discovery/** and tam-data-explorer/** changes have their own separate
# deploy workflows and shouldn't trigger a PyPI publish attempt at all.
# Tests must pass before publish runs at all -- see the `needs: test`
# dependency below. The publish step itself explicitly targets
# https://upload.pypi.org/legacy/ (see Makefile's own `publish` target).
"on":
  push:
    branches: [main]
    paths:
      - "tam/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"

      - run: uv sync --extra dev --extra live --extra notebook --extra quantstats --extra pitindex --extra marketdata

      - run: uv run pytest tests/ -q -W ignore::UserWarning

  publish:
    needs: test
    runs-on: ubuntu-latest
    env:
      # scripts/bump_version.py (run via `make version`) asks PyPI what's
      # actually live and bumps the patch number from there -- no git-side
      # version bookkeeping needed, safe to run on every commit.
      UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"

      - run: make publish
