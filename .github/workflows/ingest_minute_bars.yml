name: Ingest Minute Bars

# Incremental backfill of the PRIOR trading day's 1-minute OHLCV bars (SPY +
# that day's point-in-time S&P 500 constituents) into the R2 Parquet lake --
# see MARKETDATA.md. Tests must pass before this runs at all (same
# `needs: test` gating pattern as publish.yml).
#
# Manually triggered ONLY (workflow_dispatch) -- deliberately no `schedule:`
# cron trigger: run it by hand from the Actions tab (or `gh workflow run
# "Ingest Minute Bars"`) whenever you want to catch up, or run the same
# ingestion locally instead (see MARKETDATA.md) if you'd rather not hand a
# CI runner your R2/Massive write credentials on any kind of recurring
# schedule.
#
# This is NOT the initial multi-year backfill -- that's a one-off, multi-day
# job meant to run locally or on a dedicated machine (see MARKETDATA.md's
# walkthrough), not on a GitHub-hosted runner with a job time limit. This
# workflow only ever catches up ONE day at a time; running it again for a
# day already ingested is a fast no-op, since tam.marketdata.ingest tracks a
# resumability manifest in the store itself.
#
# Requires these repository secrets before a manual run does anything useful
# (Settings -> Secrets and variables -> Actions):
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
#   MASSIVE_S3_ACCESS_KEY_ID, MASSIVE_S3_SECRET_ACCESS_KEY
# Without them, a manual run fails fast with a clear "Missing R2 credential
# field(s)" / "Massive flat-file access_key_id required" error rather than
# silently doing nothing.
"on":
  workflow_dispatch: {}

env:
  UV_DEFAULT_INDEX: https://pypi.org/simple

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"

      - run: uv sync --extra dev --extra live --extra notebook --extra quantstats --extra pitindex --extra marketdata

      - run: uv run pytest tests/ -q -W ignore::UserWarning

  ingest:
    needs: test
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      MASSIVE_S3_ACCESS_KEY_ID: ${{ secrets.MASSIVE_S3_ACCESS_KEY_ID }}
      MASSIVE_S3_SECRET_ACCESS_KEY: ${{ secrets.MASSIVE_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"

      - run: uv sync --extra marketdata --extra pitindex

      - name: Resolve yesterday's date (UTC)
        run: |
          echo "INGEST_START=$(date -u -d yesterday +%F)" >> "$GITHUB_ENV"
          echo "INGEST_END=$(date -u -d yesterday +%F)" >> "$GITHUB_ENV"

      - run: uv run python -m examples.ingest_minute_bars examples/ingest_minute_bars_daily_config.yaml
